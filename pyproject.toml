[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-engine-compiler"
version = "0.0.1"
description = "Business simulation compiler and independent discrete-event reference runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["simpy==4.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["README.md"]
