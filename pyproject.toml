[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "sim-engine-compiler"
version = "0.1.0"
description = "Business simulation compiler and independent discrete-event reference runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["simpy==4.1.1"]

[project.scripts]
sim-engine = "sim_engine_compiler.cli:main"

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.maturin]
manifest-path = "rust/compiler/Cargo.toml"
features = ["python"]
module-name = "sim_engine_compiler._runtime"
python-source = "src"
