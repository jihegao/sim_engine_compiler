[package]
name = "sim-engine-compiler-aot"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libm = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
sim-engine-runtime = { path = "../runtime" }
pyo3 = { version = "0.26", optional = true, features = ["extension-module", "abi3-py312"] }

[features]
python = ["dep:pyo3"]

[lib]
name = "sim_engine_compiler_aot"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "sim-engine-compiler-aot"
path = "src/main.rs"
