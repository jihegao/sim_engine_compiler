[package]
name = "sim-engine-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
ryu = "1.0"

[lib]
name = "sim_engine_runtime"
path = "src/lib.rs"

[[bin]]
name = "sim-engine-runtime"
path = "src/main.rs"
