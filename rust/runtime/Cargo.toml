[package]
name = "sim-engine-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
anyhow = "1.0"
bincode = { version = "2.0", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
pyo3 = { version = "0.26", optional = true, features = ["extension-module", "abi3-py312"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
ryu = "1.0"

[features]
python = ["dep:pyo3"]
profiling = []

[lib]
name = "sim_engine_runtime"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "sim-engine-runtime"
path = "src/main.rs"

[[bin]]
name = "stage-c-benchmark"
path = "src/bin/stage_c_benchmark.rs"
